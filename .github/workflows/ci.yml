name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"

      - name: Build
        run: swift build -c release

      - name: Run Tests
        run: swift test

      - name: Run MermaidGenerator on itself
        run: |
          swift run MermaidGenerator Sources --output diagram.md
          cat diagram.md

  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    container:
      image: swiftlang/swift:nightly-main-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Run Tests
        run: swift test

      - name: Run MermaidGenerator on itself
        run: |
          swift run MermaidGenerator Sources --output diagram.md
          cat diagram.md

  lint:
    name: Swift Format Check
    runs-on: ubuntu-latest
    container:
      image: swiftlang/swift:nightly-main-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Swift Format
        run: |
          # Install swift-format if needed for stricter checks
          # For now, just verify the code compiles with strict concurrency
          swift build 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "Warnings found in build output"
            grep "warning:" build.log
            # Don't fail on warnings for now, just report them
          fi
